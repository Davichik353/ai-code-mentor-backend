services:
  - type: web
    name: ai-code-mentor-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9
