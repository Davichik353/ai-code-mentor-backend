<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Mentor - Interactive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f1419;
            color: #e0e0e0;
        }

        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #1a1f2e;
            border-right: 1px solid #2a3347;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .logo-text h2 {
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #8b8f9e;
            font-size: 13px;
            text-decoration: none;
        }

        .nav-item:hover {
            background: #252d3d;
            color: #e0e0e0;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid #2a3347;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: white;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: #1a1f2e;
            border: 1px solid #2a3347;
            border-radius: 12px;
            padding: 24px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 16px;
        }

        /* Code Editor */
        .code-editor {
            position: relative;
        }

        .editor-label {
            font-size: 12px;
            color: #8b8f9e;
            margin-bottom: 8px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #252d3d;
            border: 1px solid #2a3347;
            border-radius: 8px;
            color: #10b981;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 12px;
            resize: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #5a6170;
        }

        textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: #6366f1;
            border: 1px solid #6366f1;
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        /* Results Section */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 600px;
            overflow-y: auto;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #8b8f9e;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a3347;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            background: #252d3d;
            border-left: 3px solid;
            border-radius: 8px;
            padding: 16px;
        }

        .result-card.critical {
            border-left-color: #ef4444;
        }

        .result-card.improvement {
            border-left-color: #f59e0b;
        }

        .result-card.learning {
            border-left-color: #06b6d4;
        }

        .result-card.good {
            border-left-color: #10b981;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .result-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-critical {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .badge-improvement {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
        }

        .badge-learning {
            background: rgba(6, 182, 212, 0.2);
            color: #67e8f9;
        }

        .badge-good {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .result-title {
            font-size: 13px;
            color: white;
            font-weight: 500;
            margin: 0;
        }

        .result-text {
            font-size: 12px;
            color: #c4c4c4;
            line-height: 1.5;
            margin: 8px 0 0 0;
        }

        /* Score Display */
        .score-section {
            text-align: center;
            padding: 20px;
            background: #252d3d;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .score-number {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .score-label {
            font-size: 12px;
            color: #8b8f9e;
        }

        .score-feedback {
            font-size: 13px;
            color: #10b981;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Hints Section */
        .hints-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #2a3347;
        }

        .hints-title {
            font-size: 12px;
            font-weight: 600;
            color: #6366f1;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hint-item {
            background: rgba(99, 102, 241, 0.1);
            border-left: 2px solid #6366f1;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #a5b4fc;
            line-height: 1.4;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #dc2626;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #5a6170;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #2a3347;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <div class="logo-text">
                    <h2>AI Code Mentor</h2>
                </div>
            </div>

            <nav class="nav-items">
                <div class="nav-item active">
                    <i class="fas fa-chart-line"></i> Dashboard
                </div>
                <div class="nav-item">
                    <i class="fas fa-history"></i> History
                </div>
                <div class="nav-item">
                    <i class="fas fa-cog"></i> Settings
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main">
            <div class="header">
                <h1>Code Analysis</h1>
                <p style="color: #8b8f9e; margin-top: 4px; font-size: 13px;">Paste your Python code and get AI-powered feedback</p>
            </div>

            <div class="content">
                <!-- Code Input -->
                <div class="card">
                    <div class="code-editor">
                        <label class="editor-label">📝 Paste your Python code:</label>
                        <textarea id="codeInput" placeholder="def hello():
    print('Hello World')

# Add your code here..."></textarea>
                        <div class="button-group">
                            <button class="btn-primary" onclick="analyzeCode()">
                                <i class="fas fa-play"></i> Analyze
                            </button>
                            <button class="btn-secondary" onclick="clearCode()">
                                <i class="fas fa-trash"></i> Clear
                            </button>
                        </div>
                    </div>

                    <!-- Quick Examples -->
                    <div style="margin-top: 24px;">
                        <h3 style="font-size: 12px; color: #8b8f9e; margin-bottom: 8px;">📚 Examples:</h3>
                        <button class="btn-secondary" style="width: 100%; margin-bottom: 6px; text-align: left;" onclick="loadExample1()">
                            Bad Loop Example
                        </button>
                        <button class="btn-secondary" style="width: 100%; text-align: left;" onclick="loadExample2()">
                            SQL Injection Risk
                        </button>
                    </div>
                </div>

                <!-- Results -->
                <div class="card">
                    <h3 class="card-title">✨ Analysis Results</h3>
                    <div id="resultsContainer">
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <p>Paste code and click "Analyze" to get started</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ai-code-mentor-backend-z80q.onrender.com';

        // Load example codes
        function loadExample1() {
            document.getElementById('codeInput').value = `data = [1, 2, 3, 4, 5]
for i in range(len(data)):
    print(data[i])

result = []
for item in data:
    result.append(item * 2)`;
        }

        function loadExample2() {
            document.getElementById('codeInput').value = `import sqlite3

def get_user(user_id):
    query = f"SELECT * FROM users WHERE id = {user_id}"
    conn = sqlite3.connect("db.sqlite")
    cursor = conn.cursor()
    cursor.execute(query)
    return cursor.fetchone()`;
        }

        function clearCode() {
            document.getElementById('codeInput').value = '';
            document.getElementById('resultsContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <p>Paste code and click "Analyze" to get started</p>
                </div>
            `;
        }

        async function analyzeCode() {
            const code = document.getElementById('codeInput').value.trim();

            if (!code) {
                showError('Please paste some code first!');
                return;
            }

            if (code.length < 5) {
                showError('Code must be at least 5 characters');
                return;
            }

            showLoading();

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        code: code,
                        filename: 'analysis.py'
                    })
                });

                if (!response.ok) {
                    throw new Error('API Error: ' + response.statusText);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                showError('Cannot connect to server. Make sure backend is running on localhost:8000');
                console.error('Error:', error);
            }
        }

        function showLoading() {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing your code...</p>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-circle"></i> ${message}
                </div>
            `;
        }

        function displayResults(data) {
            const feedback = data.feedback;
            let html = '';

            // Score
            html += `
                <div class="score-section">
                    <div class="score-number">${data.score}</div>
                    <div class="score-label">/ 100</div>
                    <div class="score-feedback">${getScoreFeedback(data.score)}</div>
                </div>
            `;

            // Critical Issues
            if (feedback.critical && feedback.critical.length > 0) {
                html += `<h4 style="color: #ef4444; font-size: 12px; margin-top: 16px; margin-bottom: 8px;">🔴 CRITICAL ISSUES</h4>`;
                feedback.critical.forEach(item => {
                    html += createResultCard(item, 'critical');
                });
            }

            // Improvements
            if (feedback.improvements && feedback.improvements.length > 0) {
                html += `<h4 style="color: #f59e0b; font-size: 12px; margin-top: 16px; margin-bottom: 8px;">🟠 IMPROVEMENTS</h4>`;
                feedback.improvements.forEach(item => {
                    html += createResultCard(item, 'improvement');
                });
            }

            // Learning
            if (feedback.learning && feedback.learning.length > 0) {
                html += `<h4 style="color: #06b6d4; font-size: 12px; margin-top: 16px; margin-bottom: 8px;">🔵 LEARNING</h4>`;
                feedback.learning.forEach(item => {
                    html += createResultCard(item, 'learning');
                });
            }

            // Good Practices
            if (feedback.good && feedback.good.length > 0) {
                html += `<h4 style="color: #10b981; font-size: 12px; margin-top: 16px; margin-bottom: 8px;">🟢 GOOD</h4>`;
                feedback.good.forEach(item => {
                    html += createResultCard(item, 'good');
                });
            }

            // Mentor Hints
            if (data.mentor_hints && data.mentor_hints.length > 0) {
                html += `
                    <div class="hints-section">
                        <div class="hints-title">💡 Mentor Hints</div>
                `;
                data.mentor_hints.forEach(hint => {
                    html += `<div class="hint-item"><strong>${hint.hint}</strong><br>${hint.guide}</div>`;
                });
                html += `</div>`;
            }

            document.getElementById('resultsContainer').innerHTML = html;
        }

        function createResultCard(item, type) {
            const badgeClass = `badge-${type}`;
            let title = item.issue || item.topic || item.practice || 'Item';
            let description = item.explanation || item.why || '';
            let suggestion = item.suggestion || item.fix || item.resource || '';

            return `
                <div class="result-card ${type}">
                    <div class="result-header">
                        <span class="result-badge ${badgeClass}">${type.toUpperCase()}</span>
                    </div>
                    <h4 class="result-title">${title}</h4>
                    ${description ? `<p class="result-text">${description}</p>` : ''}
                    ${suggestion ? `<p class="result-text" style="margin-top: 8px; color: #a5b4fc;"><strong>→ ${suggestion}</strong></p>` : ''}
                </div>
            `;
        }

        function getScoreFeedback(score) {
            if (score >= 90) return '🎉 Excellent!';
            if (score >= 80) return '👍 Good!';
            if (score >= 70) return '📚 Fair';
            if (score >= 60) return '⚠️ Needs Work';
            return '🔴 Critical Issues';
        }

        // Test connection on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_URL}/`);
                if (!response.ok) {
                    console.warn('Backend not available');
                }
            } catch (e) {
                console.warn('Cannot connect to backend. Start it with: python main.py');
            }
        });
    </script>
</body>
</html>
