name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: read
jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Back up and verify recovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_BACKUP_TOKEN || secrets.TURSO_AUTH_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            test -n "$TURSO_DATABASE_URL"
            test -n "$TURSO_AUTH_TOKEN"
          fi
          python scripts/backup_database.py backup --output "$RUNNER_TEMP/database.fernet"
          python scripts/backup_database.py restore --source "$RUNNER_TEMP/database.fernet" --output "$RUNNER_TEMP/restore-check.sqlite3"
          rm "$RUNNER_TEMP/restore-check.sqlite3"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: ${{ runner.temp }}/database.fernet
          retention-days: 30
