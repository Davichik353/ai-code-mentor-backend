name: Verified Turso to PostgreSQL migration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Require production maintenance and working source
        run: |
          python - <<'PY'
          import urllib.request, json, time
          url='https://ai-code-mentor-backend-z80q.onrender.com/health?migration='+str(time.time())
          with urllib.request.urlopen(url,timeout=60) as response:
              data=json.load(response)
          assert data.get('database_maintenance') is True, 'Enable DATABASE_MAINTENANCE on Render first'
          assert data['checks']['database']['status']=='ok'
          assert data['checks']['database']['backend']=='turso'
          PY
      - name: Export current source and verify encrypted recovery
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_BACKUP_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          REQUIRE_REMOTE_DATABASE: 'true'
        run: |
          python scripts/backup_database.py backup --output "$RUNNER_TEMP/pre-migration.fernet"
          python scripts/backup_database.py restore --source "$RUNNER_TEMP/pre-migration.fernet" --output "$RUNNER_TEMP/source.sqlite3"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-pre-migration-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-migration.fernet
          retention-days: 7
      - name: Import into empty target and verify exact data on fresh connection
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_MIGRATION_URL }}
          REQUIRE_REMOTE_DATABASE: 'true'
        run: python scripts/migrate_to_postgres.py --sqlite "$RUNNER_TEMP/source.sqlite3"
      - name: Remove plaintext snapshot
        if: always()
        run: rm -f "$RUNNER_TEMP/source.sqlite3"
